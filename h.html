let customer = [
    {
        accno: 123,
        name: "Sai",
        acc_type: "Saving",
        address: "Hyderabad",
        balance: 500,
        pin: 1234,
        transactions: []
    },
    {
        accno: 124,
        name: "Ravi",
        acc_type: "Current",
        address: "Secunderabad",
        balance: 1000,
        pin: 2345,
        transactions: []
    },
    {
        accno: 125,
        name: "Kiran",
        acc_type: "Saving",
        address: "Kukatpally",
        balance: 1500,
        pin: 3456,
        transactions: []
    }
];

let loggedInCustomer = null;

// Display Account Numbers
function displayAccounts() {
    console.log("Available Account Numbers:");

    customer.forEach(c => {
        console.log(c.accno);
    });
}

// 1. Account Login
function login() {
    let accno = Number(prompt(
        "Enter Account Number: 123 / 124 / 125"
    ));

    let user = customer.find(c => c.accno === accno);

    if (user) {
        let pin = Number(prompt("Enter PIN:"));

        if (user.pin === pin) {
            loggedInCustomer = user;
            console.log("Login Successful!");
            console.log("Welcome " + user.name);
            return true;
        } else {
            console.log("Incorrect PIN");
            return false;
        }
    } else {
        console.log("Account Number Not Found");
        return false;
    }
}

// 2. Balance Enquiry
function balanceEnquiry() {
    console.log("Available Balance: Rs." +
        loggedInCustomer.balance);
}

// 3. Deposit
function deposit() {
    let amount = Number(prompt("Enter Deposit Amount:"));

    if (amount > 0) {
        loggedInCustomer.balance += amount;

        loggedInCustomer.transactions.push(
            "Deposited: Rs." + amount
        );

        console.log("Deposit Successful");
        console.log("New Balance: Rs." +
            loggedInCustomer.balance);
    } else {
        console.log("Invalid Amount");
    }
}

// 4. Withdraw
function withdraw() {
    let amount = Number(prompt("Enter Withdrawal Amount:"));

    if (amount > 0 && amount <= loggedInCustomer.balance) {
        loggedInCustomer.balance -= amount;

        loggedInCustomer.transactions.push(
            "Withdrawn: Rs." + amount
        );

        console.log("Withdrawal Successful");
        console.log("Remaining Balance: Rs." +
            loggedInCustomer.balance);
    } else {
        console.log("Insufficient Balance or Invalid Amount");
    }
}

// 5. Fund Transfer
function fundTransfer() {
    console.log("Available Receiver Accounts:");

    customer.forEach(c => {
        if (c.accno !== loggedInCustomer.accno) {
            console.log(c.accno + " - " + c.name);
        }
    });

    let accno = Number(prompt("Enter Receiver Account Number:"));

    let receiver = customer.find(c => c.accno === accno);

    if (!receiver || receiver === loggedInCustomer) {
        console.log("Invalid Receiver Account");
        return;
    }

    let amount = Number(prompt("Enter Transfer Amount:"));

    if (amount > 0 && amount <= loggedInCustomer.balance) {
        loggedInCustomer.balance -= amount;
        receiver.balance += amount;

        loggedInCustomer.transactions.push(
            "Transferred Rs." + amount + " to " + receiver.name
        );

        receiver.transactions.push(
            "Received Rs." + amount + " from " + loggedInCustomer.name
        );

        console.log("Fund Transfer Successful");
        console.log("Remaining Balance: Rs." +
            loggedInCustomer.balance);
    } else {
        console.log("Invalid Amount or Insufficient Balance");
    }
}

// 6. Mini Statement
function miniStatement() {
    console.log("Recent Transactions:");

    if (loggedInCustomer.transactions.length === 0) {
        console.log("No Transactions Available");
    } else {
        let recent = loggedInCustomer.transactions.slice(-5);

        recent.forEach((t, i) => {
            console.log((i + 1) + ". " + t);
        });
    }
}

// 7. Logout
function logout() {
    console.log("Thank You " + loggedInCustomer.name);
    console.log("Logout Successful");
    loggedInCustomer = null;
}

// Main Banking Application
displayAccounts();

if (login()) {
    let choice;

    do {
        choice = Number(prompt(
            "BANKING APPLICATION\n\n" +
            "1. Balance Enquiry\n" +
            "2. Deposit\n" +
            "3. Withdraw\n" +
            "4. Fund Transfer\n" +
            "5. Mini Statement\n" +
            "6. Logout\n\n" +
            "Enter Your Choice:"
        ));

        switch (choice) {
            case 1:
                balanceEnquiry();
                break;

            case 2:
                deposit();
                break;

            case 3:
                withdraw();
                break;

            case 4:
                fundTransfer();
                break;

            case 5:
                miniStatement();
                break;

            case 6:
                logout();
                break;

            default:
                console.log("Invalid Choice");
        }

    } while (loggedInCustomer !== null);
}
