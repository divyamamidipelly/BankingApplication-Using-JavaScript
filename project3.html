<script>
    
let movies = [
    { id: 1, name: "Devara", price: 180 },
    { id: 2, name: "Pushpa 2", price: 200 },
    { id: 3, name: "Kalki 2898 AD", price: 220 },
    { id: 4, name: "Salaar", price: 190 }
];

let theatres = ["PVR Cinemas", "INOX", "AMB Cinemas"];

let availableSeats = [
    "A1", "A2", "A3", "A4", "A5",
    "B1", "B2", "B3", "B4", "B5"
];

let selectedMovie = null;
let selectedTheatre = "";
let selectedDate = "";
let selectedTime = null;
let selectedSeats = [];
let totalPrice = 0;
let paymentDone = false;
let bookingDone = false;

// 1. Display Movies
function displayMovies() {
    console.log("===== AVAILABLE MOVIES =====");

    movies.forEach(movie => {
        console.log(
            "ID: " + movie.id +
            " | Movie: " + movie.name +
            " | Price: Rs." + movie.price
        );
    });
}

// 2. Select Movie
function selectMovie() {
    displayMovies();

    let id = Number(prompt("Enter Movie ID:"));

    selectedMovie = movies.find(movie => movie.id === id);

    if (selectedMovie) {
        console.log("Movie Selected Successfully!");
        console.log("Selected Movie: " + selectedMovie.name);
        console.log("Ticket Price: Rs." + selectedMovie.price);
    } else {
        console.log("Invalid Movie ID!");
    }
}

// 3. Select Theatre
function selectTheatre() {
    console.log("===== AVAILABLE THEATRES =====");

    theatres.forEach((theatre, index) => {
        console.log((index + 1) + ". " + theatre);
    });

    let choice = Number(prompt("Select Theatre Number:"));

    if (choice >= 1 && choice <= theatres.length) {
        selectedTheatre = theatres[choice - 1];
        console.log("Selected Theatre: " + selectedTheatre);
    } else {
        console.log("Invalid Theatre Selection!");
    }
}

// 4. Select Date
function selectDate() {
    let date = prompt("Enter Booking Date (YYYY-MM-DD):");

    if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        console.log("Invalid Date Format!");
        return;
    }

    let [year, month, day] = date.split("-").map(Number);
    let bookingDate = new Date(year, month - 1, day);

    if (
        bookingDate.getFullYear() !== year ||
        bookingDate.getMonth() !== month - 1 ||
        bookingDate.getDate() !== day
    ) {
        console.log("Invalid Calendar Date!");
        return;
    }

    let today = new Date();
    today.setHours(0, 0, 0, 0);

    if (bookingDate < today) {
        console.log("Past Dates Are Not Allowed!");
    } else {
        selectedDate = date;
        console.log("Selected Date: " + selectedDate);
    }
}

// 5. Select Show Time
function selectShowTime() {
    console.log("===== AVAILABLE SHOW TIMES =====");
    console.log("1. Morning   - 9:00 AM to 12:00 PM");
    console.log("2. Afternoon - 1:00 PM to 4:00 PM");
    console.log("3. Evening   - 6:00 PM to 9:00 PM");

    let choice = Number(prompt("Select Show Time:"));

    let times = [
        { name: "Morning", timing: "9:00 AM - 12:00 PM" },
        { name: "Afternoon", timing: "1:00 PM - 4:00 PM" },
        { name: "Evening", timing: "6:00 PM - 9:00 PM" }
    ];

    if (choice >= 1 && choice <= 3) {
        selectedTime = times[choice - 1];
        console.log("Selected Show: " + selectedTime.name);
        console.log("Timing: " + selectedTime.timing);
    } else {
        console.log("Invalid Show Time!");
    }
}

// 6. Check Seat Availability
function checkSeatAvailability() {
    console.log("===== AVAILABLE SEATS =====");
    console.log(availableSeats.join(", "));
}

// 7. Book Tickets
function bookTickets() {
    if (!selectedMovie || !selectedTheatre ||
        !selectedDate || !selectedTime) {
        console.log("Please complete movie, theatre, date and show selection first!");
        return;
    }

    if (availableSeats.length === 0) {
        console.log("No Seats Available!");
        return;
    }

    checkSeatAvailability();

    let seats = prompt(
        "Enter Seat Numbers separated by commas:\nExample: A1,A2,B1"
    );

    if (!seats || !seats.trim()) {
        console.log("Seat Selection Cancelled!");
        return;
    }

    let seatList = seats.toUpperCase().split(",").map(seat => seat.trim());

    let uniqueSeats = new Set(seatList);

    if (
        seatList.some(seat => seat === "") ||
        uniqueSeats.size !== seatList.length ||
        seatList.some(seat => !availableSeats.includes(seat))
    ) {
        console.log("Invalid, Duplicate or Already Booked Seats!");
        return;
    }

    selectedSeats = seatList;
    totalPrice = selectedSeats.length * selectedMovie.price;
    bookingDone = true;
    paymentDone = false;

    console.log("===== BOOKING DETAILS =====");
    console.log("Movie: " + selectedMovie.name);
    console.log("Theatre: " + selectedTheatre);
    console.log("Date: " + selectedDate);
    console.log("Show: " + selectedTime.name);
    console.log("Seats: " + selectedSeats.join(", "));
    console.log("Total Tickets: " + selectedSeats.length);
    console.log("Total Amount: Rs." + totalPrice);
    console.log("Tickets Booked Successfully!");
}

// 8. Calculate Ticket Price
function calculateTicketPrice() {
    if (!bookingDone) {
        console.log("Please Book Tickets First!");
        return;
    }

    totalPrice = selectedSeats.length * selectedMovie.price;

    console.log("Ticket Price: Rs." + selectedMovie.price);
    console.log("Number of Tickets: " + selectedSeats.length);
    console.log("Total Amount: Rs." + totalPrice);
}

// 9. Make Payment
function makePayment() {
    if (!bookingDone) {
        console.log("Please Book Tickets First!");
        return;
    }

    if (paymentDone) {
        console.log("Payment Already Completed!");
        return;
    }

    calculateTicketPrice();

    console.log("===== PAYMENT METHODS =====");
    console.log("1. UPI");
    console.log("2. Debit/Credit Card");
    console.log("3. Cash");

    let choice = Number(prompt("Select Payment Method:"));

    let paymentMethods = {
        1: "UPI",
        2: "Debit/Credit Card",
        3: "Cash"
    };

    if (!paymentMethods[choice]) {
        console.log("Invalid Payment Method!");
        return;
    }

    console.log("Selected Payment Method: " + paymentMethods[choice]);

    if (confirm("Pay Rs." + totalPrice + " using " + paymentMethods[choice] + "?")) {
        paymentDone = true;

        availableSeats = availableSeats.filter(
            seat => !selectedSeats.includes(seat)
        );

        console.log("Payment Successful!");
        console.log("Payment Method: " + paymentMethods[choice]);
        console.log("Amount Paid: Rs." + totalPrice);
    } else {
        console.log("Payment Cancelled!");
    }
}

// 10. Generate Ticket
function generateTicket() {
    if (!paymentDone) {
        console.log("Please Complete Payment First!");
        return;
    }

    console.log("========== MOVIE TICKET ==========");
    console.log("Booking ID: " + Math.floor(100000 + Math.random() * 900000));
    console.log("Movie: " + selectedMovie.name);
    console.log("Theatre: " + selectedTheatre);
    console.log("Date: " + selectedDate);
    console.log("Show: " + selectedTime.name);
    console.log("Timing: " + selectedTime.timing);
    console.log("Seats: " + selectedSeats.join(", "));
    console.log("Total Tickets: " + selectedSeats.length);
    console.log("Total Amount: Rs." + totalPrice);
    console.log("Payment Status: Successful");
    console.log("Booking Status: Confirmed");
    console.log("==================================");
}

// Main Menu
let choice;

do {
    choice = prompt(
        "===== ONLINE MOVIE TICKET BOOKING =====\n" +
        "1. Display Movies\n" +
        "2. Select Movie\n" +
        "3. Select Theatre\n" +
        "4. Select Date\n" +
        "5. Select Show Time\n" +
        "6. Check Seat Availability\n" +
        "7. Book Tickets\n" +
        "8. Calculate Ticket Price\n" +
        "9. Make Payment\n" +
        "10. Generate Ticket\n" +
        "0. Exit\n\n" +
        "Enter Your Choice:"
    );

    if (choice === null) {
        break;
    }

    switch (choice.trim()) {
        case "1":
            displayMovies();
            break;
        case "2":
            selectMovie();
            break;
        case "3":
            selectTheatre();
            break;
        case "4":
            selectDate();
            break;
        case "5":
            selectShowTime();
            break;
        case "6":
            checkSeatAvailability();
            break;
        case "7":
            bookTickets();
            break;
        case "8":
            calculateTicketPrice();
            break;
        case "9":
            makePayment();
            break;
        case "10":
            generateTicket();
            break;
        case "0":
            console.log("Thank You! Visit Again.");
            break;
        default:
            console.log("Invalid Choice!");
    }

} while (choice.trim() !== "0");

</script>
