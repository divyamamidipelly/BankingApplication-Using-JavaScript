<script>

<script>

// CUSTOMER DETAILS

var customer = [
    {
        accno: 123,
        name: "Sai",
        acc_type: "Saving",
        address: "Hyderabad",
        balance: 500,
        pin: 1234,
        transactions: []
    },
    {
        accno: 124,
        name: "Ravi",
        acc_type: "Current",
        address: "Secunderabad",
        balance: 1000,
        pin: 2345,
        transactions: []
    },
    {
        accno: 125,
        name: "Kiran",
        acc_type: "Saving",
        address: "Kukatpally",
        balance: 1500,
        pin: 3456,
        transactions: []
    }
];

var loggedInCustomer = null;


// DISPLAY OUTPUT ON BROWSER PAGE

function display(message) {

    document.getElementById("output").innerHTML = message;

}


// 1. ACCOUNT LOGIN

function login() {

    var accno = Number(prompt("Enter Account Number:"));

    var pin = Number(prompt("Enter Account PIN:"));

    var user = null;

    for (var i = 0; i < customer.length; i++) {

        if (customer[i].accno === accno) {

            user = customer[i];

            break;
        }
    }

    if (user === null) {

        display("<h3>Account Number Not Found!</h3>");

        return;
    }

    if (user.pin === pin) {

        loggedInCustomer = user;

        document.getElementById("login").style.display = "none";

        document.getElementById("banking").style.display = "block";

        document.getElementById("welcome").innerHTML =
            "Welcome " + user.name;

        display("<h3>Login Successful!</h3>" +
            "Welcome " + user.name);

    } else {

        display("<h3>Incorrect PIN!</h3>");

    }

}


// CHECK LOGIN

function checkLogin() {

    if (loggedInCustomer === null) {

        display("<h3>Please Login First!</h3>");

        return false;
    }

    return true;
}


// 2. ACCOUNT DETAILS

function accountDetails() {

    if (!checkLogin()) {
        return;
    }

    var message = "<h3>Account Details</h3>";

    message += "Account Number: " + loggedInCustomer.accno + "<br>";

    message += "Customer Name: " + loggedInCustomer.name + "<br>";

    message += "Account Type: " + loggedInCustomer.acc_type + "<br>";

    message += "Address: " + loggedInCustomer.address + "<br>";

    message += "Available Balance: Rs. " + loggedInCustomer.balance;

    display(message);

}


// 3. BALANCE ENQUIRY

function balanceEnquiry() {

    if (!checkLogin()) {
        return;
    }

    var message = "<h3>Balance Enquiry</h3>";

    message += "Account Holder: " + loggedInCustomer.name + "<br>";

    message += "Available Balance: Rs. " + loggedInCustomer.balance;

    display(message);

}


// 4. DEPOSIT

function deposit() {

    if (!checkLogin()) {
        return;
    }

    var amount = Number(prompt("Enter Deposit Amount:"));

    if (!Number.isFinite(amount) || amount <= 0) {

        display("<h3>Invalid Deposit Amount!</h3>");

    } else {

        loggedInCustomer.balance += amount;

        loggedInCustomer.transactions.push(
            "Deposited Rs. " + amount
        );

        var message = "<h3>Deposit Successful!</h3>";

        message += "Deposited Amount: Rs. " + amount + "<br>";

        message += "New Balance: Rs. " + loggedInCustomer.balance;

        display(message);

    }

}


// 5. WITHDRAW

function withdraw() {

    if (!checkLogin()) {
        return;
    }

    var amount = Number(prompt("Enter Withdrawal Amount:"));

    if (!Number.isFinite(amount) || amount <= 0) {

        display("<h3>Invalid Withdrawal Amount!</h3>");

    } else if (amount > loggedInCustomer.balance) {

        display("<h3>Insufficient Balance!</h3>");

    } else {

        loggedInCustomer.balance -= amount;

        loggedInCustomer.transactions.push(
            "Withdrawn Rs. " + amount
        );

        var message = "<h3>Withdrawal Successful!</h3>";

        message += "Withdrawn Amount: Rs. " + amount + "<br>";

        message += "Remaining Balance: Rs. " + loggedInCustomer.balance;

        display(message);

    }

}


// 6. FUND TRANSFER

function fundTransfer() {

    if (!checkLogin()) {
        return;
    }

    var message = "<h3>Available Receiver Accounts</h3>";

    for (var i = 0; i < customer.length; i++) {

        if (customer[i].accno !== loggedInCustomer.accno) {

            message += "Account: " + customer[i].accno +
                " | Name: " + customer[i].name + "<br>";

        }
    }

    display(message);

    var accno = Number(prompt("Enter Receiver Account Number:"));

    var receiver = null;

    for (var i = 0; i < customer.length; i++) {

        if (customer[i].accno === accno) {

            receiver = customer[i];

            break;
        }
    }

    if (receiver === null || receiver === loggedInCustomer) {

        display("<h3>Invalid Receiver Account!</h3>");

        return;
    }

    var amount = Number(prompt("Enter Transfer Amount:"));

    if (!Number.isFinite(amount) || amount <= 0) {

        display("<h3>Invalid Transfer Amount!</h3>");

    } else if (amount > loggedInCustomer.balance) {

        display("<h3>Insufficient Balance!</h3>");

    } else {

        loggedInCustomer.balance -= amount;

        receiver.balance += amount;

        loggedInCustomer.transactions.push(
            "Transferred Rs. " + amount + " to " + receiver.name
        );

        receiver.transactions.push(
            "Received Rs. " + amount + " from " + loggedInCustomer.name
        );

        var result = "<h3>Fund Transfer Successful!</h3>";

        result += "Receiver Name: " + receiver.name + "<br>";

        result += "Transferred Amount: Rs. " + amount + "<br>";

        result += "Remaining Balance: Rs. " + loggedInCustomer.balance;

        display(result);

    }

}


// 7. MINI STATEMENT

function miniStatement() {

    if (!checkLogin()) {
        return;
    }

    var message = "<h3>Mini Statement</h3>";

    message += "Account Holder: " + loggedInCustomer.name + "<br><br>";

    if (loggedInCustomer.transactions.length === 0) {

        message += "No Transactions Available";

    } else {

        var recent = loggedInCustomer.transactions.slice(-5);

        for (var i = 0; i < recent.length; i++) {

            message += (i + 1) + ". " + recent[i] + "<br>";

        }
    }

    display(message);

}


// 8. LOGOUT

function logout() {

    if (!checkLogin()) {
        return;
    }

    var name = loggedInCustomer.name;

    loggedInCustomer = null;

    document.getElementById("banking").style.display = "none";

    document.getElementById("login").style.display = "block";

    display("<h3>Logout Successful!</h3>" +
        "Thank You " + name + "<br>Please Visit Again!");

}


// MAIN APPLICATION STARTS HERE

</script>


<h2> BANKING APPLICATION </h2>

<div id="login">

    <h3>Account Login</h3>

    <button onclick="login()">Login</button>

</div>


<div id="banking" style="display:none;">

    <h3 id="welcome"></h3>

    <h3>Select Banking Operation</h3>

    <button onclick="accountDetails()">
        1. Account Details
    </button>

    <button onclick="balanceEnquiry()">
        2. Balance Enquiry
    </button>

    <button onclick="deposit()">
        3. Deposit
    </button>

    <button onclick="withdraw()">
        4. Withdraw
    </button>

    <button onclick="fundTransfer()">
        5. Fund Transfer
    </button>

    <button onclick="miniStatement()">
        6. Mini Statement
    </button>

    <button onclick="logout()">
        7. Logout
    </button>

</div>


<hr>

<div id="output">

    <h3>Welcome to Banking Application</h3>

    Please Login to Continue.

</div>


</script>
